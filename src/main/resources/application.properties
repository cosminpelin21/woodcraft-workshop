# Conectare la baza de date MySQL din XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/wood_workshop?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Generare automata a tabelelor din clasele Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Limitare upload fisiere la 12 MB
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB

# Salvare log-uri in fisier
logging.file.name=logs/aplicatie.log