<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin dashboard for managing WoodCraft Workshop products.">
    <title>Admin Panel | WoodCraft Workshop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<nav class="navbar-wood">
    <div class="container d-flex justify-content-between align-items-center">
        <a th:href="@{/}" class="fs-4 fw-bold">WoodCraft Admin</a>
        <a th:href="@{/}">Back to Storefront</a>
    </div>
</nav>

<main class="container my-4">
    <h1 class="mb-4">Workshop Management</h1>
    <div th:if="${param.added}" class="alert alert-success">Product added successfully!</div>
    <div th:if="${param.deleted}" class="alert alert-warning">Product deleted!</div>

    <!-- Add Product Form -->
    <div class="card p-4 mb-5 shadow-sm">
        <h2 class="h4 mb-3">Add New Wooden Product</h2>
        <form th:action="@{/admin/products/add}" th:object="${newProduct}" method="post" enctype="multipart/form-data">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Product Title</label>
                    <input type="text" th:field="*{title}" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Category</label>
                    <select name="categoryId" class="form-select" required>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Price ($)</label>
                    <input type="number" step="0.01" th:field="*{price}" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Wood Type</label>
                    <input type="text" th:field="*{woodType}" placeholder="e.g. Solid Oak" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Dimensions</label>
                    <input type="text" th:field="*{dimensions}" placeholder="e.g. 180x90x75 cm" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Product Image (.jpg, .png, .pdf - max 12MB)</label>
                    <input type="file" name="imageFile" accept=".jpg,.jpeg,.png,.pdf" class="form-control">
                </div>
                <div class="col-12">
                    <label class="form-label">Description</label>
                    <textarea th:field="*{description}" class="form-control" rows="2" required></textarea>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-wood">Save Product</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Manage Existing Products -->
    <h2 class="h4 mb-3">Manage Catalog</h2>
    <div class="table-responsive-mobile">
        <table class="table table-bordered bg-white">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Category</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="prod : ${products}">
                <td th:text="${prod.id}">1</td>
                <td th:text="${prod.title}">Chair</td>
                <td th:text="${prod.category.name}">Chairs</td>
                <td th:text="'$' + ${prod.price}">$145.00</td>
                <td>
                    <form th:action="@{/admin/products/delete/{id}(id=${prod.id})}" method="post">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
