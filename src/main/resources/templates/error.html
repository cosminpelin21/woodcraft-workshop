<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | WoodCraft Workshop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 text-center" style="max-width: 500px;">
    <div class="alert alert-danger p-4 shadow-sm">
        <h1 class="h4">Oops! Something went wrong</h1>
        <p th:text="${errorMessage}">An unexpected error occurred.</p>
        <a th:href="@{/}" class="btn btn-dark mt-2">Return to Home</a>
    </div>
</div>
</body>
</html>
