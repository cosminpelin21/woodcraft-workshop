<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your WoodCraft Workshop account.">
    <title>Login | WoodCraft Workshop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="container mt-5" style="max-width: 420px;">
    <div class="card p-4 shadow-sm">
        <h1 class="h3 mb-3 text-center">Sign In</h1>
        <div th:if="${param.error}" class="alert alert-danger">Invalid email or password.</div>
        <div th:if="${param.registered}" class="alert alert-success">Account created! Please log in.</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Email Address</label>
                <input type="email" id="username" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-wood w-100">Login</button>
        </form>

        <div class="mt-3 text-center">
            <a th:href="@{/register}">Don't have an account? Register</a><br>
            <a th:href="@{/}" class="small text-muted">Back to Home</a>
        </div>
        <hr>
        <p class="small text-muted mb-0">
            <strong>Demo Admin:</strong> admin@woodcraft.com / admin123<br>
            <strong>Demo Client:</strong> client@woodcraft.com / client123
        </p>
    </div>
</div>
</body>
</html>
