<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View your WoodCraft Workshop furniture orders.">
    <title>My Orders | WoodCraft Workshop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<nav class="navbar-wood">
    <div class="container d-flex justify-content-between align-items-center">
        <a th:href="@{/}" class="fs-4 fw-bold">WoodCraft Workshop</a>
        <a th:href="@{/}">Back to Catalog</a>
    </div>
</nav>

<main class="container my-4">
    <h1 class="mb-3">My Orders</h1>
    <div th:if="${param.success}" class="alert alert-success">Order placed successfully!</div>

    <div class="table-responsive-mobile">
        <table class="table table-bordered bg-white">
            <thead class="table-dark">
            <tr>
                <th>Order ID</th>
                <th>Product</th>
                <th>Quantity</th>
                <th>Total Price</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}">1</td>
                <td th:text="${order.product.title}">Oak Chair</td>
                <td th:text="${order.quantity}">1</td>
                <td th:text="'$' + ${order.totalPrice}">$145.00</td>
                <td>
                        <span class="badge"
                              th:classappend="${order.paymentStatus == 'PAID'} ? 'bg-success' : 'bg-warning text-dark'"
                              th:text="${order.paymentStatus}">PENDING</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
